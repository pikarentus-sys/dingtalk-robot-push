name: 测试钉钉机器人推送
on:
  workflow_dispatch:  # 仅手动触发测试

jobs:
  test-message:
    runs-on: ubuntu-latest
    steps:
      - name: 发送测试消息
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://oapi.dingtalk.com/robot/send?access_token=22fe2796127ebe0288d78fdd1e0a3b1c1e97f409e5fd680e6ad5f272c945a770'
          method: 'POST'
          contentType: 'application/json'
          data: |
            {
              "msgtype": "text",
              "text": {
                "content": "机器人提醒：这是一条测试消息"
              }
            }
