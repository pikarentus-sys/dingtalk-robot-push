name: 每日早8点AI资讯
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 发送消息
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://oapi.dingtalk.com/robot/send?access_token=22fe2796127ebe0288d78fdd1e0a3b1c1e97f409e5fd680e6ad5f272c945a770'
          method: 'POST'
          contentType: 'application/json'
          data: |
            {
              "msgtype": "text",
              "text": {
                "content": "机器人提醒：\n1. OpenAI发布新一代大模型\n2. 阿里通义千问升级多模态能力\n3. 谷歌Gemini 1.5 Pro全面开放\n4. AI视频生成技术突破\n5. 国内AI大模型全面降价"
              }
            }
