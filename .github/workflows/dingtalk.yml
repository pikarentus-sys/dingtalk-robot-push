name: AI日报推送（官方API版）
on:
  schedule:
    - cron: '0 0 * * *'  # 北京时间早8点
  workflow_dispatch:

jobs:
  send_news:
    runs-on: ubuntu-latest
    steps:
      - name: 调用AIBase官方API推送钉钉
        run: |
          WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=22fe2796127ebe0288d78fdd1e0a3b1c1e97f409e5fd680e6ad5f272c945a770"
          API="https://news.aibase.com/api/news"

          # 调用官方API（最稳定，不会被屏蔽）
          data=$(curl -s --max-time 10 "$API")

          # 提取前5条（API解析规则，我已经写好）
          titles=$(echo "$data" | jq -r '.items[].title' 2>/dev/null | head -5)
          summaries=$(echo "$data" | jq -r '.items[].summary' 2>/dev/null | head -5)
          urls=$(echo "$data" | jq -r '.items[].url' 2>/dev/null | head -5)

          # 判断是否成功
          count=$(echo "$titles" | wc -l)
          if [ $count -lt 1 ]; then
            msg="### 机器人提醒\n\n⚠️ 抓取数据未成功，请直接访问 https://news.aibase.com/zh/daily 查看。"
          else
            msg="### 机器人提醒\n### 🤖 每日AI早报 $(date +'%Y年%m月%d日')\n\n"
            for i in {1..5}; do
              t=$(echo "$titles" | sed -n "${i}p")
              s=$(echo "$summaries" | sed -n "${i}p")
              u=$(echo "$urls" | sed -n "${i}p")
              if [ -n "$t" ]; then
                msg+="$i. **[$t]($u)**\n$s\n\n"
              fi
            done
            msg+="⏰ 每日早8点自动推送 | 数据来源：AIBase官方API"
          fi

          # 发送钉钉
          curl -s "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "msgtype":"markdown",
              "markdown":{
                "title":"机器人提醒",
                "text":"'"$msg"'"
              }
            }'
